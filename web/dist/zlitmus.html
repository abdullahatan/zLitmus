<style>
:root {
  --ink: #0F1B2A;
  --pass: #1FA463;
  --fail: #E0484E;
  --waiting: #B8C2CE;
  --slogan: #5B6573;
  --text: #0F1B2A;
  --bg: #F4F6F9;
  --panel: #FFFFFF;
  --panel-2: #EDF1F5;
  --panel-3: #F6F8FA;
  --editor: #FFFFFF;
  --statusbar: #E4E9EF;
  --line: #D9DEE5;
  --line-strong: #B8C2CE;
  --muted: #5B6573;
  --hover: #E8EDF3;
  --select: #D7E3F4;
  --accent: #2F5D8C;
  --primary: #0F1B2A;
  --primary-hover: #22344B;
  --x-tag: #1F4E8C;
  --x-attr: #8A3A00;
  --x-val: #0B7A3E;
  --x-comment: #8A94A3;
  --fault-bg: #FDECEC; --fault-line: #F4B9BB; --fault-text: #8E1F24;
  --hint-bg: #EEF4FB; --hint-line: #C9D9EC;
  --note-bg: #FFF4E5; --note-line: #F0D3A8; --note-text: #7A4B00;
  /* Floating surfaces (dialogs, menus): elevation by a lighter surface + border + scrim (works in dark too) */
  --overlay-surface: #FFFFFF;
  --overlay-head: #EEF2F7;
  --overlay-border: #9AA7B8;
  --overlay-shadow: 0 12px 32px rgba(15, 27, 42, .28), 0 2px 6px rgba(15, 27, 42, .12);
  --scrim: rgba(15, 27, 42, .40);
  --field-border: #B8C2CE;
  --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
  --ui: "Segoe UI", Tahoma, Arial, sans-serif;
  color-scheme: light;
}

:root[data-theme="dark"] {
  --text: #E3E8EF;
  --bg: #11161D;
  --panel: #1A212B;
  --panel-2: #202934;
  --panel-3: #1E2630;
  --editor: #141A22;
  --statusbar: #161C24;
  --line: #2E3946;
  --line-strong: #435163;
  --muted: #95A2B3;
  --hover: #26313E;
  --select: #2B3F58;
  --accent: #7FB0E6;
  --primary: #3B6EA5;
  --primary-hover: #4A7FB8;
  --x-tag: #7FB0E6;
  --x-attr: #E0A86A;
  --x-val: #8BD3A5;
  --x-comment: #6F7C8C;
  --fault-bg: #3A1E22; --fault-line: #6B2F35; --fault-text: #F4B9BB;
  --hint-bg: #1C2A3A; --hint-line: #2F4A68;
  --note-bg: #3A2E1A; --note-line: #6B5427; --note-text: #F0D3A8;
  /* Dark: shadows are hardly visible, so the dialog surface is clearly lighter than the page (about +16 % white,
     the Material 24dp level), has a light border and the page behind is dimmed by a dark scrim */
  --overlay-surface: #2B3544;
  --overlay-head: #354153;
  --overlay-border: #6A7C93;
  --overlay-shadow: 0 16px 40px rgba(0, 0, 0, .70), 0 0 0 1px rgba(255, 255, 255, .05);
  --scrim: rgba(0, 0, 0, .62);
  --field-border: #5C6E85;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body { font: 12px/1.4 var(--ui); color: var(--text); background: var(--bg); }
input, select, textarea { background: var(--editor); color: var(--text); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }

.unsupported { padding: 40px; font-size: 14px; max-width: 720px; }
.unsupported h1 { font-size: 18px; }

.app { display: flex; flex-direction: column; height: 100%; }

/* Top bar and menu */
.topbar { display: flex; align-items: center; background: var(--ink); color: #fff; height: 34px;
  border-bottom: 1px solid rgba(255, 255, 255, .12); padding: 0 6px; flex: none; }
/* Logo of the top bar: the light lockup (mark + name) on the dark bar, in both themes */
.brand { display: flex; align-items: center; height: 100%; padding: 0 8px 0 4px; margin-right: 6px;
  border-right: 1px solid rgba(255, 255, 255, .18); }
.brand svg { height: 25px; width: auto; display: block; }
.menubar { display: flex; height: 100%; }
.menubar .menu-title { background: none; border: 0; color: #fff; padding: 0 10px; height: 100%; cursor: default; }
.menubar .menu-title:hover, .menubar .menu-title.open, .menubar .menu-title:focus { background: rgba(255, 255, 255, .15); outline: none; }
.menubar .mnemonic { text-decoration: underline; }
.session { font-size: 11px; opacity: .75; }

.popup { position: fixed; z-index: 50; background: var(--overlay-surface); border: 1px solid var(--overlay-border);
  box-shadow: var(--overlay-shadow); min-width: 220px; padding: 3px 0; }
.popup .item { display: flex; align-items: center; padding: 4px 14px 4px 22px; cursor: default; white-space: nowrap; }
.popup .item .shortcut { margin-left: auto; padding-left: 24px; color: var(--muted); }
.popup .item.active { background: var(--select); }
.popup .item.disabled { color: var(--muted); opacity: .5; }
.popup .item.checked::before { content: "\2713"; position: absolute; margin-left: -15px; }
.popup .sep { height: 1px; background: var(--line); margin: 3px 0; }

/* Toolbar */
.toolbar { display: flex; align-items: center; gap: 2px; padding: 3px 6px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
.toolbar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; }
.tb { display: inline-flex; align-items: center; gap: 5px; border: 1px solid transparent; background: none; padding: 3px 8px; border-radius: 3px; cursor: pointer; }
.tb:hover:not(:disabled) { background: var(--hover); border-color: var(--line); }
.tb:disabled { opacity: .45; cursor: default; }
.tb .glyph { font-size: 14px; line-height: 1; }
.tb.send .glyph { color: var(--pass); }

/* Main layout */
.main { flex: 1; display: flex; min-height: 0; }
.side { display: flex; flex-direction: column; width: 280px; min-width: 160px; flex: none; }
.workspace { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel); border-left: 1px solid var(--line); }
.panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.panel.navigator { flex: 1; }
.panel.properties { height: 200px; flex: none; }
.panel-title { padding: 4px 8px; font-weight: 600; background: var(--panel-2); border-bottom: 1px solid var(--line); flex: none; }
.splitter { background: var(--line); flex: none; }
.splitter.v { width: 4px; cursor: col-resize; }
.splitter.h { height: 4px; cursor: row-resize; }
.splitter:hover { background: var(--line-strong); }

/* Navigator tree */
.tree { flex: 1; overflow: auto; padding: 3px 0; outline: none; }
.node { display: flex; align-items: center; height: 21px; padding-right: 8px; white-space: nowrap; cursor: default; }
.node:hover { background: var(--hover); }
.node.selected { background: var(--select); }
.tree:focus .node.selected { outline: 1px dotted var(--accent); outline-offset: -1px; }
.node .twisty { width: 14px; text-align: center; color: var(--muted); flex: none; }
.node .icon { width: 16px; height: 14px; margin-right: 4px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; border-radius: 2px; }
.icon.project { background: var(--primary); color: #fff; }
.icon.binding { background: #6C7A8C; color: #fff; }
.icon.operation { border: 1px solid #6C7A8C; color: #6C7A8C; }
.icon.request { color: var(--accent); }
.node .label { overflow: hidden; text-overflow: ellipsis; }
.node .badge { margin-left: 6px; color: var(--muted); font-size: 11px; }
.node.stale .label { color: var(--x-comment); text-decoration: line-through; }
.node.dirty .label::after { content: " *"; color: var(--fail); }
.tree .empty { padding: 10px; color: var(--muted); }

/* Properties */
.props-wrap { position: relative; min-width: 100%; }
.props-wrap.resizing, .props-wrap.resizing * { cursor: col-resize !important; user-select: none; }
.props { width: 100%; border-collapse: collapse; table-layout: fixed; }
.props thead th { position: sticky; top: 0; z-index: 1; background: var(--panel-2); color: var(--text); font-weight: 600;
  border-bottom: 1px solid var(--line-strong); }
.props tbody th, .props thead th.label-head { border-right: 1px solid var(--line-strong); }
.props .col-grip { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 2; }
.props-wrap .col-grip:hover, .props-wrap.resizing .col-grip { background: var(--accent); opacity: .35; }
.props th, .props td { border-bottom: 1px solid var(--line); padding: 3px 6px; text-align: left; vertical-align: top; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.props tbody th { font-weight: normal; color: var(--muted); background: var(--panel-3); }
#props { overflow: auto; flex: 1; }
#props .empty { padding: 8px; color: var(--muted); }

/* Tabs */
.tabs { display: flex; align-items: flex-end; background: var(--panel-2); border-bottom: 1px solid var(--line); flex: none; overflow-x: auto; min-height: 27px; }
.tab { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid transparent; border-bottom: 0; margin: 2px 0 0 2px; cursor: default; white-space: nowrap; max-width: 240px; }
.tab .title { overflow: hidden; text-overflow: ellipsis; }
.tab.active { background: var(--panel); border-color: var(--line); margin-bottom: -1px; }
.tab .close { border: 0; background: none; padding: 0 2px; cursor: pointer; color: var(--muted); }
.tab .close:hover { color: var(--fail); }
.tabs.small .tab { padding: 2px 10px; }
.tab-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* Start page */
.start { flex: 1; overflow: auto; padding: 32px 40px; }
.start .lockup svg { width: 420px; max-width: 100%; height: auto; }
.start .cards { display: flex; gap: 16px; margin: 28px 0; flex-wrap: wrap; }
.card { width: 240px; border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; background: var(--panel); cursor: pointer; text-align: left; }
.card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(15, 27, 42, .08); }
.card .card-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.card .card-text { color: var(--muted); }
.recent h3 { font-size: 13px; margin: 0 0 6px; }
.recent ul { list-style: none; padding: 0; margin: 0; }
.recent li a { color: var(--accent); cursor: pointer; text-decoration: none; }
.recent li a:hover { text-decoration: underline; }
.recent li { padding: 3px 0; }
.recent .muted, .muted { color: var(--muted); }

/* Request window */
.request { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.req-toolbar { display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-bottom: 1px solid var(--line); flex: none; }
.req-toolbar .endpoint { flex: 1; min-width: 120px; padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: 3px; }
.req-toolbar .opinfo { color: var(--muted); margin-left: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30%; }
.stale-note { background: var(--note-bg); border-bottom: 1px solid var(--note-line); padding: 4px 8px; color: var(--note-text); flex: none; }
.panes { flex: 1; display: flex; min-height: 0; }
.panes.vertical { flex-direction: column; }
.pane { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.panes > .pane:last-child { flex: 1 1 0; }
/* Divider between request and response: drag to resize, double-click for equal halves */
.pane-split { flex: none; width: 6px; cursor: col-resize; background: var(--line); border-left: 1px solid var(--line-strong);
  border-right: 1px solid var(--line-strong); }
.panes.vertical .pane-split { width: auto; height: 6px; cursor: row-resize; border: 0;
  border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line-strong); }
.pane-split:hover, .panes.resizing .pane-split { background: var(--accent); }
.panes.resizing, .panes.resizing * { user-select: none; }
.panes.resizing { cursor: col-resize; }
.panes.vertical.resizing { cursor: row-resize; }
.pane-head { display: flex; align-items: center; background: var(--panel-3); border-bottom: 1px solid var(--line); flex: none; }
.pane-head .pane-name { font-weight: 600; padding: 0 8px; }
.subtabs { display: flex; }
.subtab { border: 0; background: none; padding: 4px 10px; cursor: pointer; border-bottom: 2px solid transparent; }
.subtab.active { border-bottom-color: var(--accent); font-weight: 600; }
.pane-body { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.pane-foot { flex: none; border-top: 1px solid var(--line); }
.pane-foot .subtabs { background: var(--panel-3); }
.pane-foot .foot-body { height: 150px; overflow: auto; padding: 6px 8px; border-top: 1px solid var(--line); }
.editor { flex: 1; width: 100%; border: 0; resize: none; padding: 6px 8px; font: 12px/1.45 var(--mono); outline: none; tab-size: 3; white-space: pre; overflow: auto; background: var(--editor); }
.wrap .editor, .wrap .xmlview { white-space: pre-wrap; word-break: break-all; }
.xmlview { flex: 1; margin: 0; padding: 6px 8px; overflow: auto; font: 12px/1.45 var(--mono); white-space: pre; background: var(--editor); }
.xmlview .t { color: var(--x-tag); }
.xmlview .a { color: var(--x-attr); }
.xmlview .v { color: var(--x-val); }
.xmlview .c { color: var(--x-comment); font-style: italic; }
.statusline { display: flex; align-items: center; gap: 8px; padding: 3px 8px; border-top: 1px solid var(--line); background: var(--panel-3); flex: none; min-height: 24px; }
.statusline .mark svg { width: 18px; height: 18px; display: block; }
.statusline .code { font-weight: 600; }
.statusline .code.pass { color: var(--pass); }
.statusline .code.fail { color: var(--fail); }
.fault, .hint { margin: 6px 8px 0; padding: 6px 8px; border-radius: 3px; flex: none; }
.fault { background: var(--fault-bg); border: 1px solid var(--fault-line); color: var(--fault-text); }
.hint { background: var(--hint-bg); border: 1px solid var(--hint-line); }
.kv { width: 100%; border-collapse: collapse; }
.kv td, .kv th { border-bottom: 1px solid var(--line); padding: 2px 4px; text-align: left; }
.kv th { font-weight: 600; color: var(--muted); }
.kv input { width: 100%; border: 1px solid var(--line); padding: 2px 4px; }
.kv tr.auto td { color: var(--x-comment); }
.kv tr.auto.replaced td { text-decoration: line-through; }
.form-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.form-row label { width: 130px; color: var(--muted); flex: none; }
.form-row input, .form-row select { flex: 1; padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: 3px; }
.link-btn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 2px 0; }
.link-btn:hover { text-decoration: underline; }
.empty-pane { padding: 12px; color: var(--muted); }

/* Log panel */
.logpanel { height: 150px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid var(--line); }
.log-body { flex: 1; overflow: auto; font: 11px/1.5 var(--mono); padding: 2px 6px; }
.log-line { white-space: pre-wrap; }
.log-line .time { color: var(--x-comment); margin-right: 8px; }
.log-line.E { color: var(--fail); }
.log-line.W { color: #9A5B00; }

.statusbar { display: flex; gap: 16px; padding: 2px 8px; background: var(--statusbar); border-top: 1px solid var(--line); flex: none; font-size: 11px; min-height: 20px; }
.statusbar .msg.E { color: var(--fail); }
.statusbar .msg.W { color: #9A5B00; }
.statusbar .right { margin-left: auto; color: var(--muted); }

/* Dialogs */
.overlay { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: center; justify-content: center; z-index: 60; }
.dialog { background: var(--overlay-surface); border: 1px solid var(--overlay-border); border-radius: 6px;
  box-shadow: var(--overlay-shadow); min-width: 420px; max-width: 760px; max-height: 86vh; display: flex; flex-direction: column; }
.dialog-head { padding: 10px 14px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--overlay-border);
  background: var(--overlay-head); border-radius: 6px 6px 0 0; display: flex; align-items: center; }
.dialog-head .x { margin-left: auto; border: 0; background: none; font-size: 16px; cursor: pointer; color: var(--muted); }
.dialog-body { padding: 12px 14px; overflow: auto; }
.dialog-body p { margin: 0 0 10px; }
.dialog-foot { padding: 10px 14px; border-top: 1px solid var(--overlay-border); display: flex; justify-content: flex-end; gap: 8px; }
.btn { border: 1px solid var(--line-strong); color: var(--text); background: var(--editor); padding: 4px 14px; border-radius: 3px; cursor: pointer; min-width: 80px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary-hover); }
.check { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
.list { border: 1px solid var(--line); max-height: 320px; overflow: auto; }
.list .row { display: flex; gap: 10px; padding: 5px 8px; border-bottom: 1px solid var(--line); cursor: default; }
.list .row:hover { background: var(--hover); }
.list .row.active { background: var(--select); }
.list .row .name { font-weight: 600; min-width: 140px; }
.list .row .meta { color: var(--muted); margin-left: auto; white-space: nowrap; }
.guide h4 { margin: 12px 0 4px; }
.guide ol, .guide ul { margin: 0; padding-left: 18px; }
.about { text-align: center; }
.about svg { width: 300px; height: auto; }

.busy { position: fixed; inset: 0; background: rgba(128, 128, 128, .35); display: flex; align-items: center; justify-content: center; z-index: 80; cursor: progress; }
.busy-box { background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 4px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 14px rgba(15, 27, 42, .15); }
.spinner { width: 14px; height: 14px; border: 2px solid var(--waiting); border-top-color: var(--text); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast { position: fixed; right: 16px; bottom: 34px; background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 4px; z-index: 90; max-width: 480px; }
.toast.E { background: var(--fail); }

/* Theme switch, catalog nodes, editable properties, binding window */
/* Theme switch in the top bar: "Theme  sun [track/knob] moon  Light|Dark" */
.theme-switch { display: inline-flex; align-items: center; gap: 7px; margin: 0 14px 0 auto; height: 24px; padding: 0 12px;
  color: #fff; background: rgba(255, 255, 255, .08); border: 1px solid rgba(255, 255, 255, .35); border-radius: 12px;
  font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
.theme-switch:hover { background: rgba(255, 255, 255, .16); }
.theme-switch:focus-visible { outline: 2px solid #7FB0E6; outline-offset: 1px; }
.theme-switch .ts-label { opacity: .85; }
.theme-switch .ts-icon { display: inline-flex; color: rgba(255, 255, 255, .4); }
.theme-switch .ts-icon.sun { color: #FFC845; }
.theme-switch.dark .ts-icon.sun { color: rgba(255, 255, 255, .4); }
.theme-switch.dark .ts-icon.moon { color: #9CC4F0; }
.theme-switch .ts-track { position: relative; width: 34px; height: 18px; border-radius: 9px; background: #E9EEF4;
  border: 1px solid rgba(255, 255, 255, .5); transition: background .15s; }
.theme-switch.dark .ts-track { background: #2F5D8C; }
.theme-switch .ts-knob { position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
  background: #0F1B2A; transition: left .15s; }
.theme-switch.dark .ts-knob { left: 18px; background: #fff; }
.theme-switch .ts-state { min-width: 34px; text-align: left; }
:root[data-theme="dark"] .mark circle, :root[data-theme="dark"] .mark polyline { stroke: #E3E8EF; }
:root[data-theme="dark"] .mark g path:first-child { fill: #E3E8EF; }
.node.catalog .label { color: var(--muted); }
.icon.catalog { border: 1px solid var(--muted); color: var(--muted); }
.props td.edit { padding: 1px 2px; }
.props td.edit input, .props td.edit select { width: 100%; border: 1px solid transparent; padding: 2px 4px; font: inherit; }
.props td.edit input:hover, .props td.edit select:hover { border-color: var(--line); }
.props td.edit input:focus, .props td.edit select:focus { border-color: var(--accent); outline: none; }
.props .hint-row td { color: var(--muted); font-style: italic; white-space: normal; }
.binding-window { flex: 1; display: flex; flex-direction: column; min-height: 0; }
.binding-window > .subtabs { border-bottom: 1px solid var(--line); background: var(--panel-3); flex: none; }
.binding-body { flex: 1; overflow: auto; padding: 10px 14px; min-height: 0; }
.binding-body .section { margin-bottom: 14px; }
.binding-body .section h4 { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.binding-body .grid { width: 100%; border-collapse: collapse; }
.binding-body .grid th, .binding-body .grid td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.binding-body .grid th { color: var(--muted); font-weight: 600; background: var(--panel-3); }
.binding-body .grid td.mono { font-family: var(--mono); word-break: break-all; }
.binding-body .grid.def th { width: 160px; font-weight: normal; background: none; }
.binding-body .add-row { display: flex; gap: 6px; margin-top: 8px; }
.binding-body .add-row input, .binding-body .grid td input { flex: 1; width: 100%; padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: 3px; }
.binding-body .tag { font-size: 10px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--line-strong); color: var(--muted); }
.binding-body .docs { display: flex; gap: 10px; height: 100%; min-height: 300px; }
.binding-body .doc-list { width: 260px; flex: none; border: 1px solid var(--line); overflow: auto; }
.binding-body .doc-list .row { padding: 4px 8px; border-bottom: 1px solid var(--line); cursor: pointer; word-break: break-all; }
.binding-body .doc-list .row.active { background: var(--select); }
.binding-body .doc-view { flex: 1; border: 1px solid var(--line); min-width: 0; display: flex; }

/* Fields inside floating surfaces: darker than the surface (inset) with a visible border */
.dialog input[type="text"], .dialog input[type="password"], .dialog input[type="number"], .dialog select,
.dialog textarea { border: 1px solid var(--field-border); border-radius: 3px; padding: 4px 6px; background: var(--editor); }
.dialog input:focus, .dialog select:focus, .dialog textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.dialog .btn:not(.primary) { background: transparent; border-color: var(--field-border); }
:root[data-theme="dark"] .popup .item.active { background: #3A4B63; }

/* Coloured XML editor: transparent textarea over the highlighted layer (identical metrics) */
.code-editor { position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--editor); }
.code-editor .code-layer, .code-editor .code-input { position: absolute; top: 0; left: 0; margin: 0; border: 0;
  padding: 6px 8px; font: 12px/1.45 var(--mono); tab-size: 3; -moz-tab-size: 3; white-space: pre;
  letter-spacing: normal; word-spacing: normal; box-sizing: border-box; }
.code-editor .code-layer { overflow: hidden; pointer-events: none; width: 100%; height: 100%; background: transparent; }
.code-editor .code-input { width: 100%; height: 100%; overflow: auto; resize: none; background: transparent;
  color: transparent; caret-color: var(--text); z-index: 1; }
.code-editor .code-input::selection { background: rgba(47, 93, 140, .35); color: transparent; }
.wrap .code-editor .code-layer, .wrap .code-editor .code-input { white-space: pre-wrap; word-break: break-all; }
.pane-head .pane-action { margin-left: auto; margin-right: 6px; display: inline-flex; align-items: center; gap: 4px;
  border: 1px solid var(--line-strong); background: transparent; color: var(--text); border-radius: 3px; padding: 1px 8px;
  cursor: pointer; font-size: 11px; }
.pane-head .pane-action:hover:not(:disabled) { background: var(--hover); }
.pane-head .pane-action:disabled { opacity: .45; cursor: default; }

/* Text field with a button on its right (New SOAP Project: WSDL + Browse...) */
.input-with-button { display: flex; flex: 1; gap: 6px; align-items: center; min-width: 0; }
.input-with-button input[type="text"] { flex: 1; min-width: 0; }
.input-with-button .btn { min-width: 0; padding: 4px 10px; white-space: nowrap; }

</style>
</head>

/* ======================================================================
 * zLitmus - XML pretty print, highlight and SOAP fault detection
 * ==================================================================== */
ZL.Xml = (function () {
  var esc = ZL.util.esc;
  var ENVELOPE_11 = 'http://schemas.xmlsoap.org/soap/envelope/';
  var ENVELOPE_12 = 'http://www.w3.org/2003/05/soap-envelope';

  function indent(depth) { return new Array(depth + 1).join('   '); }

  function parse(text) {
    var doc = new DOMParser().parseFromString(text, 'application/xml');
    return doc.getElementsByTagName('parsererror').length ? null : doc;
  }

  /* Indented XML, or null when the text is no well-formed XML */
  function pretty(text) {
    var source = String(text || '').trim();
    if (!source || source.charAt(0) !== '<') return null;
    var doc = parse(source);
    if (!doc) return null;
    var out = [];
    var declaration = /^<\?xml[^>]*\?>/.exec(source);
    if (declaration) out.push(declaration[0]);

    function attributes(element) {
      var text = '';
      for (var i = 0; i < element.attributes.length; i++) {
        text += ' ' + element.attributes[i].name + '="' + esc(element.attributes[i].value) + '"';
      }
      return text;
    }

    function walk(node, depth) {
      var pad = indent(depth);
      if (node.nodeType === 8) { out.push(pad + '<!--' + node.nodeValue + '-->'); return; }
      if (node.nodeType === 4) { out.push(pad + '<![CDATA[' + node.nodeValue + ']]>'); return; }
      if (node.nodeType === 7) { out.push(pad + '<?' + node.target + ' ' + node.data + '?>'); return; }
      if (node.nodeType !== 1) return;
      var name = node.nodeName;
      var children = Array.prototype.filter.call(node.childNodes, function (child) {
        return !(child.nodeType === 3 && !child.nodeValue.trim());
      });
      if (!children.length) { out.push(pad + '<' + name + attributes(node) + '/>'); return; }
      var onlyText = children.every(function (child) { return child.nodeType === 3; });
      if (onlyText) {
        var value = children.map(function (child) { return child.nodeValue; }).join('');
        out.push(pad + '<' + name + attributes(node) + '>' + esc(value).replace(/&quot;/g, '"') + '</' + name + '>');
        return;
      }
      out.push(pad + '<' + name + attributes(node) + '>');
      children.forEach(function (child) {
        if (child.nodeType === 3) out.push(indent(depth + 1) + esc(child.nodeValue.trim()).replace(/&quot;/g, '"'));
        else walk(child, depth + 1);
      });
      out.push(pad + '</' + name + '>');
    }

    Array.prototype.forEach.call(doc.childNodes, function (node) { walk(node, 0); });
    return out.join('\n');
  }

  /* HTML with spans: t = tag, a = attribute name, v = attribute value, c = comment / CDATA / PI */
  function highlight(text) {
    var tokens = /(<!--[\s\S]*?-->)|(<!\[CDATA\[[\s\S]*?\]\]>)|(<\?[\s\S]*?\?>)|(<\/?[^\s>\/]+)((?:\s+[^\s=>]+\s*=\s*(?:"[^"]*"|'[^']*'))*)(\s*)(\/?>)|([^<]+)|(<)/g;
    var out = '';
    var match;
    while ((match = tokens.exec(text))) {
      if (match[1] || match[2] || match[3]) out += '<span class="c">' + esc(match[0]) + '</span>';
      else if (match[4]) {
        out += '<span class="t">' + esc(match[4]) + '</span>';
        if (match[5]) {
          out += match[5].replace(/([^\s=]+)(\s*=\s*)("[^"]*"|'[^']*')/g, function (all, name, equals, value) {
            return '<span class="a">' + esc(name) + '</span>' + equals + '<span class="v">' + esc(value) + '</span>';
          });
        }
        out += esc(match[6]) + '<span class="t">' + esc(match[7]) + '</span>';
      } else out += esc(match[0]);
      if (tokens.lastIndex === match.index) tokens.lastIndex++;
    }
    return out;
  }

  /* "SOAP Fault [code]: text" of a response, '' when there is none */
  function faultOf(text) {
    try {
      var doc = parse(String(text || '').trim());
      if (!doc) return '';
      var fault = doc.getElementsByTagNameNS(ENVELOPE_11, 'Fault')[0] || doc.getElementsByTagNameNS(ENVELOPE_12, 'Fault')[0];
      if (!fault) return '';
      var code = '';
      var reason = '';
      for (var child = fault.firstElementChild; child; child = child.nextElementSibling) {
        if (child.localName === 'faultcode' || child.localName === 'Code') code = child.textContent.trim().replace(/\s+/g, ' ');
        if (child.localName === 'faultstring' || child.localName === 'Reason') reason = child.textContent.trim();
      }
      return 'SOAP Fault' + (code ? ' [' + code + ']' : '') + (reason ? ': ' + reason : '');
    } catch (e) { return ''; }
  }

  return { pretty: pretty, highlight: highlight, faultOf: faultOf, indent: indent, parse: parse,
           ENVELOPE_11: ENVELOPE_11, ENVELOPE_12: ENVELOPE_12 };
})();

 * data, because SAP GUI shows the page again after each action. WSDL documents are not part
 * of it: ABAP keeps them in the session and sends them as "workspace64".
 * Passwords live only here (session memory); they are never saved with a project.
 * ==================================================================== */
ZL.State = (function () {
  var MAX_LOG_LINES = 500;
  var MAX_RESPONSES = 20;
  var MAX_RECENT = 8;
  var state = fresh();
  var wsdlBundles = {};
  var wsdlModels = {};
  var catalog = [];

  function fresh() {
    return {
      version: 1,
      projects: [],
      tabs: [{ id: 'start', type: 'start' }],
      active: 'start',
      selection: null,
      expanded: {},
      responses: {},
      responseOrder: [],
      passwords: {},
      wsdlAuth: {},
      pending: null,
      lastAction: null,
      queue: [],
      logs: { app: [], http: [], error: [] },
      logTab: 'app',
      requestView: {},
      prefs: defaultPrefs(),
      prefsDirty: false,
      newProjectDraft: null
    };
  }

  function defaultPrefs() {
    return { navWidth: 280, propsHeight: 200, logHeight: 150, wrap: false, layout: 'horizontal',
             showNav: true, showProps: true, showLog: true, recent: [], theme: 'light',
             propsLabelWidth: 140, paneRatio: 0.5 };
  }

  function get() { return state; }

  function restore(ui) {
    state = fresh();
    if (ui && typeof ui === 'object' && ui.version === 1) {
      Object.keys(state).forEach(function (key) { if (ui[key] !== undefined) state[key] = ui[key]; });
      state.prefs = Object.assign(defaultPrefs(), state.prefs || {});
    }
    if (!state.tabs.some(function (tab) { return tab.id === 'start'; })) state.tabs.unshift({ id: 'start', type: 'start' });
    return state;
  }

  function applyPrefs(prefs) {
    state.prefs = Object.assign(defaultPrefs(), prefs || {});
  }

  /* What is sent to ABAP as "ui" */
  function snapshot() { return JSON.stringify(state); }

  /* ---- projects and requests ---- */
  function project(projectId) {
    for (var i = 0; i < state.projects.length; i++) if (state.projects[i].header.projectId === projectId) return state.projects[i];
    return null;
  }

  function findRequest(requestId) {
    for (var i = 0; i < state.projects.length; i++) {
      var requests = state.projects[i].requests;
      for (var j = 0; j < requests.length; j++) {
        if (requests[j].requestId === requestId) return { project: state.projects[i], request: requests[j] };
      }
    }
    return null;
  }

  function normalizeRequest(request) {
    return {
      requestId: request.requestId || ZL.util.uuid(),
      interfaceName: request.interfaceName || '',
      operation: request.operation || '',
      name: request.name || 'Request 1',
      endpoint: request.endpoint || '',
      body: request.body || '',
      headers: (request.headers || []).map(function (h) { return { name: h.name || '', value: h.value || '' }; }),
      authType: request.authType || 'NONE',
      authUser: request.authUser || '',
      timeoutSec: request.timeoutSec || 0,
      description: request.description || '',
      encoding: request.encoding || ''
    };
  }

  /* Project from ABAP replaces the open one (dirty flag is cleared) */
  function upsertProject(data) {
    var header = data.header || {};
    header.endpoints = (header.endpoints || []).map(function (e) {
      return { interfaceName: e.interfaceName || '', url: e.url || '' };
    });
    var entry = {
      header: header,
      requests: (data.requests || []).map(normalizeRequest),
      dirty: false
    };
    var existing = project(entry.header.projectId);
    if (existing) {
      existing.header = entry.header;
      existing.requests = entry.requests;
      existing.dirty = false;
      return existing;
    }
    state.projects.push(entry);
    state.expanded['p:' + entry.header.projectId] = true;
    return entry;
  }

  function removeProject(projectId) {
    var entry = project(projectId);
    state.projects = state.projects.filter(function (p) { return p.header.projectId !== projectId; });
    state.tabs = state.tabs.filter(function (tab) { return tab.projectId !== projectId; });
    if (!state.tabs.some(function (tab) { return tab.id === state.active; })) state.active = 'start';
    if (state.selection && state.selection.projectId === projectId) state.selection = null;
    if (entry) {
      entry.requests.forEach(function (r) { delete state.responses[r.requestId]; delete state.passwords[r.requestId]; });
    }
    delete wsdlBundles[projectId];
    delete wsdlModels[projectId];
  }

  function markDirty(projectId) {
    var entry = project(projectId);
    if (entry) entry.dirty = true;
  }

  function dirtyProjects() { return state.projects.filter(function (p) { return p.dirty; }); }

  /* ---- WSDL of the open projects (from workspace64, not part of the UI state) ---- */
  function setWorkspace(workspace) {
    wsdlBundles = {};
    wsdlModels = {};
    ((workspace && workspace.projects) || []).forEach(function (p) { wsdlBundles[p.projectId] = p.wsdl || {}; });
  }

  function setWsdl(projectId, bundle) {
    wsdlBundles[projectId] = bundle;
    delete wsdlModels[projectId];
  }

  function wsdl(projectId) {
    if (!wsdlModels[projectId] && wsdlBundles[projectId]) wsdlModels[projectId] = new ZL.Wsdl(wsdlBundles[projectId]);
    return wsdlModels[projectId] || null;
  }

  function wsdlBundle(projectId) { return wsdlBundles[projectId] || null; }

  /* ---- responses ---- */
  function setResponse(requestId, response) {
    state.responses[requestId] = response;
    state.responseOrder = state.responseOrder.filter(function (id) { return id !== requestId; }).concat([requestId]);
    while (state.responseOrder.length > MAX_RESPONSES) delete state.responses[state.responseOrder.shift()];
  }

  /* ---- logs ---- */
  function log(kind, type, text) {
    var lines = state.logs[kind] || (state.logs[kind] = []);
    lines.push({ time: ZL.util.time(), type: type || 'I', text: String(text) });
    while (lines.length > MAX_LOG_LINES) lines.shift();
  }

  /* ---- recent projects (ui_prefs) ---- */
  function remember(header) {
    var recent = state.prefs.recent.filter(function (r) { return r.projectId !== header.projectId; });
    recent.unshift({ projectId: header.projectId, name: header.name });
    state.prefs.recent = recent.slice(0, MAX_RECENT);
    state.prefsDirty = true;
  }

  function forget(projectId) {
    state.prefs.recent = state.prefs.recent.filter(function (r) { return r.projectId !== projectId; });
    state.prefsDirty = true;
  }

  /* ---- tabs ---- */
  function openTab(tab) {
    if (!state.tabs.some(function (t) { return t.id === tab.id; })) state.tabs.push(tab);
    state.active = tab.id;
  }

  function closeTab(id) {
    if (id === 'start') return;
    var index = -1;
    state.tabs.forEach(function (tab, i) { if (tab.id === id) index = i; });
    if (index < 0) return;
    state.tabs.splice(index, 1);
    if (state.active === id) state.active = state.tabs[Math.max(0, index - 1)].id;
  }

  /* ---- saved projects of the user (boot list, not part of the UI state) ---- */
  function setCatalog(list) { catalog = Array.isArray(list) ? list : []; }
  function catalogEntries() { return catalog; }

  return {
    setCatalog: setCatalog, catalog: catalogEntries,
    get: get, restore: restore, snapshot: snapshot, applyPrefs: applyPrefs, defaultPrefs: defaultPrefs,
    project: project, findRequest: findRequest, upsertProject: upsertProject, removeProject: removeProject,
    normalizeRequest: normalizeRequest, markDirty: markDirty, dirtyProjects: dirtyProjects,
    setWorkspace: setWorkspace, setWsdl: setWsdl, wsdl: wsdl, wsdlBundle: wsdlBundle,
    setResponse: setResponse, log: log, remember: remember, forget: forget,
    openTab: openTab, closeTab: closeTab
  };
})();

/* ======================================================================
 * zLitmus - bridge to ABAP (SAPEVENT) and to the browser mock
 * Page -> ABAP: form POST to "sapevent:<ACTION>", field "payload" = base64 of lines
 *               "KEY TAB NAME TAB base64(value)" (V = value, H = HTTP header).
 *               Every action carries "V ui" (the state of the page, JSON).
 * ABAP -> page: the whole page is shown again; the boot JSON holds the answer ("reply"),
 *               the state ("ui64") and the WSDL documents of the open projects ("workspace64").
 * ==================================================================== */
ZL.Bridge = (function () {
  var util = ZL.util;
  var boot = readBoot();
  var waitTimer = null;
  var NETWORK_ACTIONS = ['PROJECT_CREATE', 'PROJECT_REFRESH_WSDL', 'REQUEST_SEND', 'PAGE_INSTALL', 'FILE_EXPORT',
                         'WSDL_BROWSE'];
  var LOCAL_WAIT_MS = 20000;

  function readBoot() {
    var node = util.$('zlitmus-boot');
    var raw = node ? node.textContent.trim() : '';
    if (!raw || raw.indexOf('__') === 0) return { runtime: 'browser' };
    try { return JSON.parse(raw); } catch (e) { return { runtime: 'browser', bootError: String(e) }; }
  }

  function isSap() { return boot.runtime === 'sap'; }

  /* lines: [[key, name, value]] -> base64 of "KEY\tNAME\tbase64(value)" rows */
  function encode(lines) {
    return util.toBase64(lines.map(function (line) {
      return line[0] + '\t' + line[1] + '\t' + util.toBase64(line[2] == null ? '' : String(line[2]));
    }).join('\n'));
  }

  /* values: {name: value}, headers: [{name, value}] */
  function linesOf(values, headers) {
    var lines = [['V', 'ui', ZL.State.snapshot()]];
    Object.keys(values || {}).forEach(function (name) { lines.push(['V', name, values[name]]); });
    (headers || []).forEach(function (h) { lines.push(['H', h.name, h.value]); });
    return lines;
  }

  function busy(on, text) {
    util.$('busyText').textContent = text || ZL.i18n.t('busy.working');
    util.$('busy').hidden = !on;
  }

  function send(action, values, headers, busyText) {
    var lines = linesOf(values, headers);
    busy(true, busyText);
    if (!isSap()) {
      return ZL.Mock.handle(action, lines).then(function (result) {
        busy(false);
        ZL.App.receive(result);
      }, function (error) {
        busy(false);
        ZL.App.receive({ reply: { kind: action.toLowerCase(), ok: false, message: String(error) },
                         message: { type: 'E', text: String(error) } });
      });
    }
    var form = util.$('bridgeForm');
    form.action = 'sapevent:' + action;
    form.elements.payload.value = encode(lines);
    form.submit();
    /* ABAP answers by showing the page again; if nothing comes back, do not stay blocked. Only actions that go
       to the network (WSDL, request) may take as long as the HTTP timeout. */
    var settings = ZL.App.settings() || {};
    clearTimeout(waitTimer);
    waitTimer = setTimeout(function () {
      busy(false);
      ZL.App.toast(ZL.i18n.t('bridge.noAnswer'), 'E');
    }, NETWORK_ACTIONS.indexOf(action) >= 0 ? ((settings.timeoutSec || 60) + 30) * 1000 : LOCAL_WAIT_MS);
    return Promise.resolve();
  }

  /* Quiet state update for ABAP (no busy overlay, no page reload): only "ui" */
  function sync() {
    if (!isSap() || !util.$('busy').hidden) return;
    var form = util.$('bridgeForm');
    form.action = 'sapevent:UI_SYNC';
    form.elements.payload.value = encode([['V', 'ui', ZL.State.snapshot()]]);
    form.submit();
  }

  function decodeJson(base64) {
    if (!base64) return null;
    try { return JSON.parse(util.fromBase64(base64)); } catch (e) { return null; }
  }

  return {
    boot: function () { return boot; },
    isSap: isSap,
    encode: encode,
    linesOf: linesOf,
    send: send,
    sync: sync,
    busy: busy,
    decodeJson: decodeJson
  };
})();

/* ======================================================================
 * zLitmus - browser mock of the ABAP side (runtime !== 'sap')
 * Opening web/dist/zlitmus.html in a browser works without SAP: the actions are handled in
 * memory, WSDL addresses are answered from the embedded test fixtures (web/test/fixtures) and
 * projects are kept in localStorage (memory when it is not available). No password is stored.
 * Fixture addresses: any URL that ends with a fixture path, e.g. "mock://fixtures/calc.wsdl".
 * Addresses containing "secure" answer 401 without credentials; requests to URLs containing
 * "fault" answer with a SOAP fault.
 * ==================================================================== */
ZL.Mock = (function () {
  var util = ZL.util;
  var STORE_KEY = 'zlitmus.mock.v1';
  var fixtures = readFixtures();
  var memory = load();
  var open = {};
  var localFiles = {};

  function readFixtures() {
    var node = document.getElementById('zlitmus-fixtures');
    try { return node ? JSON.parse(node.textContent) : {}; } catch (e) { return {}; }
  }

  function load() {
    try {
      var raw = window.localStorage && window.localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) { /* storage not available: memory only */ }
    return { projects: {}, settings: { timeoutSec: 60, sslId: 'ANONYM', proxyHost: '', proxyPort: '', uiPrefs: '' } };
  }

  function persist() {
    try { if (window.localStorage) window.localStorage.setItem(STORE_KEY, JSON.stringify(memory)); } catch (e) { /* ignore */ }
  }

  function value(lines, name) {
    for (var i = 0; i < lines.length; i++) if (lines[i][0] === 'V' && lines[i][1] === name) return lines[i][2];
    return '';
  }

  function headersOf(lines) {
    return lines.filter(function (l) { return l[0] === 'H'; }).map(function (l) { return { name: l[1], value: l[2] }; });
  }

  function now() { return new Date().toISOString(); }

  function fixtureFor(url) {
    var keys = Object.keys(fixtures);
    for (var i = 0; i < keys.length; i++) {
      var plain = url.split('?')[0].split('#')[0];
      if (plain === keys[i] || plain.slice(-(keys[i].length + 1)) === '/' + keys[i]) return fixtures[keys[i]];
    }
    return null;
  }

  /* A WSDL file chosen in the browser: kept in memory under file:///<name> (like a file of the PC in SAP GUI) */
  function addLocalFile(name, text) {
    var url = 'file:///' + name;
    localFiles[url] = text;
    return url;
  }

  function download(url) {
    if (localFiles[url] != null) {
      return Promise.resolve({ url: url, status: 200, contentType: 'text/xml', text: localFiles[url] });
    }
    if (/^file:/i.test(url)) return Promise.resolve({ url: url, status: 0, contentType: '', text: '', error: url });
    var text = fixtureFor(url);
    if (text != null) return Promise.resolve({ url: url, status: 200, contentType: 'text/xml; charset=utf-8', text: text });
    return fetch(url).then(function (response) {
      return response.text().then(function (body) {
        return { url: url, status: response.status, contentType: response.headers.get('content-type') || '', text: body };
      });
    }, function (error) {
      return { url: url, status: 0, contentType: '', text: '', error: String(error) };
    });
  }

  function loadWsdl(url, user) {
    if (/secure/i.test(url) && !user) {
      return Promise.resolve({ url: url, documents: [], authRequired: true, realm: 'zLitmus mock' });
    }
    var documents = [];
    function next(address) {
      if (documents.length >= 40 || documents.some(function (d) { return d.url === address; })) return Promise.resolve();
      return download(address).then(function (doc) {
        var ok = doc.status >= 200 && doc.status < 300;
        documents.push({ url: address, status: doc.status, contentType: doc.contentType,
                         error: ok ? '' : (doc.error || 'HTTP ' + doc.status), b64: util.toBase64(doc.text) });
        if (!ok) return null;
        return ZL.Wsdl.Refs.extract(doc.text).reduce(function (chain, reference) {
          return chain.then(function () { return next(ZL.Wsdl.Refs.resolve(address, reference)); });
        }, Promise.resolve());
      });
    }
    return next(url).then(function () { return { url: url, loadedAt: now(), documents: documents }; });
  }

  /* Like ABAP check_wsdl_loaded: an answer whose root is not wsdl:definitions / description is no WSDL */
  function notWsdl(wsdl) {
    var first = wsdl.documents[0];
    var text = first && first.b64 ? util.fromBase64(first.b64) : '';
    var root = (/<(?![?!])(?:[\w.-]+:)?([\w.-]+)/.exec(text) || [])[1] || '';
    if (root === 'definitions' || root === 'description') return '';
    var error = (/<errorText>([^<]*)/.exec(text) || [])[1] || '';
    return ZL.i18n.t('mock.notWsdl', { root: root, error: error });
  }

  function workspace() {
    return { projects: Object.keys(open).map(function (id) { return { projectId: id, wsdl: open[id] }; }) };
  }

  /* Saved projects of the user (boot list "projects" of ABAP) */
  function catalog() {
    return Object.keys(memory.projects).map(function (id) {
      var p = memory.projects[id];
      return { projectId: id, name: p.header.name, wsdlUrl: p.header.wsdlUrl, changedAt: p.header.changedAt,
               requestCount: p.requests.length };
    }).sort(function (x, y) { return x.name.localeCompare(y.name); });
  }

  function result(reply, message) {
    return { reply: reply, workspace: workspace(), settings: memory.settings, projects: catalog(),
             message: message || (reply.message ? { type: reply.ok ? 'S' : 'E', text: reply.message } : null) };
  }

  function failure(action, text) {
    return result({ kind: action.toLowerCase(), ok: false, message: text }, { type: 'E', text: text });
  }

  function stored(projectId) { return memory.projects[projectId] || null; }

  function projectJson(entry) {
    return { header: entry.header, requests: entry.requests };
  }

  function nameExists(name, exceptId) {
    return Object.keys(memory.projects).some(function (id) {
      return id !== exceptId && memory.projects[id].header.name.toUpperCase() === name.toUpperCase();
    });
  }

  function createProject(lines) {
    var t = ZL.i18n.t;
    var url = value(lines, 'wsdl_url').trim();
    return loadWsdl(url, value(lines, 'wsdl_user')).then(function (wsdl) {
      if (wsdl.authRequired) {
        var host = url.replace(/^[a-z]+:\/\//i, '').split(/[\/?#]/)[0];
        return result({ kind: 'auth_required', ok: false, action: 'PROJECT_CREATE', url: url, host: host,
                        realm: wsdl.realm, message: t('auth.required', { host: host }) },
                      { type: 'W', text: t('auth.required', { host: host }) });
      }
      var first = wsdl.documents[0];
      if (!first || first.error) return failure('PROJECT_CREATE', t('mock.wsdlFailed', { error: first ? first.error : '' }));
      if (notWsdl(wsdl)) return failure('PROJECT_CREATE', notWsdl(wsdl));
      var name = value(lines, 'name').trim() || new ZL.Wsdl(wsdl).firstServiceName() || 'SOAP Project';
      if (nameExists(name)) return failure('PROJECT_CREATE', t('mock.nameExists', { name: name }));
      var header = { projectId: util.uuid(), owner: 'MOCK', projectType: 'SOAP', name: name, wsdlUrl: url,
                     wsdlLoadedAt: wsdl.loadedAt, createdAt: now(), changedAt: now(), endpoints: [] };
      memory.projects[header.projectId] = { header: header, requests: [], wsdl: wsdl };
      open[header.projectId] = wsdl;
      persist();
      return result({ kind: 'project', ok: true, project: { header: header, requests: [] },
                      createSamples: value(lines, 'create_samples') === 'true',
                      message: t('mock.wsdlLoaded', { count: wsdl.documents.length }) });
    });
  }

  function refreshWsdl(lines) {
    var t = ZL.i18n.t;
    var entry = stored(value(lines, 'project_id'));
    if (!entry) return Promise.resolve(failure('PROJECT_REFRESH_WSDL', t('mock.notFound')));
    var url = entry.header.wsdlUrl;
    return loadWsdl(url, value(lines, 'wsdl_user')).then(function (wsdl) {
      if (wsdl.authRequired) {
        var host = url.replace(/^[a-z]+:\/\//i, '').split(/[\/?#]/)[0];
        return result({ kind: 'auth_required', ok: false, action: 'PROJECT_REFRESH_WSDL', url: url, host: host,
                        realm: wsdl.realm, message: t('auth.required', { host: host }) });
      }
      entry.wsdl = wsdl;
      entry.header.wsdlLoadedAt = wsdl.loadedAt;
      open[entry.header.projectId] = wsdl;
      persist();
      return result({ kind: 'project', ok: true, project: projectJson(entry),
                      message: t('mock.wsdlLoaded', { count: wsdl.documents.length }) });
    });
  }

  function sendRequest(lines) {
    var url = value(lines, 'url');
    var body = value(lines, 'body');
    var started = Date.now();
    var sent = headersOf(lines).map(function (h) { return { n: h.name, v: h.value }; });
    var basic = value(lines, 'auth_type') === 'BASIC' && value(lines, 'user');
    if (basic) sent.push({ n: 'Authorization', v: 'Basic ********' });
    var status = 200;
    var reason = 'OK';
    var answer;
    if (/secure/i.test(url) && !basic) {
      status = 401; reason = 'Unauthorized'; answer = '<html><body>401 Unauthorized</body></html>';
    } else if (/fault/i.test(url) || /<fault/i.test(body)) {
      status = 500; reason = 'Internal Server Error';
      answer = '<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"><soapenv:Body>' +
               '<soapenv:Fault><faultcode>soapenv:Server</faultcode><faultstring>Mock fault</faultstring>' +
               '</soapenv:Fault></soapenv:Body></soapenv:Envelope>';
    } else {
      var operation = (/<(?:[\w.\-]+:)?Body[^>]*>\s*<(?:[\w.\-]+:)?([\w.\-]+)/.exec(body) || [])[1] || 'Operation';
      answer = '<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"><soapenv:Body>' +
               '<' + operation + 'Response xmlns="urn:zlitmus:mock"><result>42</result></' + operation + 'Response>' +
               '</soapenv:Body></soapenv:Envelope>';
    }
    var bytes = util.utf8(answer);
    return Promise.resolve(result({
      kind: 'response', ok: true, projectId: value(lines, 'project_id'), requestId: value(lines, 'request_id'),
      status: status, reason: reason, timeMs: Date.now() - started + 7, size: bytes.length,
      headers: [{ n: 'Content-Type', v: 'text/xml; charset=utf-8' }, { n: 'Content-Length', v: String(bytes.length) }],
      body64: util.bytesToBase64(bytes), message: 'HTTP ' + status + ' ' + reason, hint: '',
      request: { method: value(lines, 'method') || 'POST', url: url, headers: sent }
    }, { type: status >= 400 ? 'W' : 'S', text: 'HTTP ' + status + ' ' + reason }));
  }

  function handle(action, lines) {
    var t = ZL.i18n.t;
    var projectId = value(lines, 'project_id');
    var entry;
    var prefs = value(lines, 'prefs');
    if (prefs) { memory.settings.uiPrefs = prefs; persist(); }
    switch (action) {
      case 'PROJECT_LIST':
        return Promise.resolve(result({ kind: 'projects', ok: true, projects: catalog() }));
      case 'PROJECT_CREATE':
        return createProject(lines);
      case 'PROJECT_OPEN':
        entry = stored(projectId);
        if (!entry) return Promise.resolve(failure(action, t('mock.notFound')));
        open[projectId] = entry.wsdl;
        return Promise.resolve(result({ kind: 'project', ok: true, project: projectJson(entry) }));
      case 'PROJECT_SAVE': {
        var data = JSON.parse(value(lines, 'project') || '{}');
        entry = stored(data.header && data.header.projectId);
        if (!entry) return Promise.resolve(failure(action, t('mock.notFound')));
        entry.requests = (data.requests || []).map(function (r, i) {
          var copy = ZL.State.normalizeRequest(r);
          copy.position = i + 1;
          return copy;
        });
        entry.header.endpoints = ((data.header && data.header.endpoints) || []).map(function (e) {
          return { interfaceName: e.interfaceName || '', url: e.url || '' };
        });
        entry.header.changedAt = now();
        persist();
        return Promise.resolve(result({ kind: 'saved', ok: true, project: projectJson(entry), message: t('msg.saved') }));
      }
      case 'PROJECT_RENAME':
        entry = stored(projectId);
        if (!entry) return Promise.resolve(failure(action, t('mock.notFound')));
        if (nameExists(value(lines, 'name'), projectId)) {
          return Promise.resolve(failure(action, t('mock.nameExists', { name: value(lines, 'name') })));
        }
        entry.header.name = value(lines, 'name');
        persist();
        return Promise.resolve(result({ kind: 'saved', ok: true, project: projectJson(entry), message: t('msg.saved') }));
      case 'PROJECT_REFRESH_WSDL':
        return refreshWsdl(lines);
      case 'PROJECT_DELETE':
        delete memory.projects[projectId];
        delete open[projectId];
        persist();
        return Promise.resolve(result({ kind: 'deleted', ok: true, projectId: projectId, message: t('msg.deleted') }));
      case 'PROJECT_CLOSE':
        delete open[projectId];
        return Promise.resolve(result({ kind: 'closed', ok: true, projectId: projectId }));
      case 'REQUEST_SEND':
        return sendRequest(lines);
      case 'PREFS_SAVE':
        return Promise.resolve(result({ kind: 'prefs', ok: true }));
      case 'SETTINGS_SAVE':
        memory.settings = Object.assign(memory.settings, JSON.parse(value(lines, 'settings') || '{}'));
        persist();
        return Promise.resolve(result({ kind: 'settings', ok: true, settings: memory.settings, message: t('msg.saved') }));
      case 'EXIT':
        return Promise.resolve(result({ kind: 'exit', ok: true }, { type: 'S', text: t('mock.exit') }));
      default:
        return Promise.resolve(failure(action, t('mock.unknownAction', { action: action })));
    }
  }

  return {
    handle: handle,
    settings: function () { return memory.settings; },
    catalog: catalog,
    addLocalFile: addLocalFile,
    fixtureNames: function () { return Object.keys(fixtures); },
    reset: function () { memory = { projects: {}, settings: load().settings }; open = {}; persist(); }
  };
})();

/* ======================================================================
 * zLitmus - modal dialogs inside the page (no alert / confirm / prompt)
 * ==================================================================== */
ZL.Dialogs = (function () {
  var util = ZL.util;
  var h = util.h;
  var t = ZL.i18n.t;
  var stack = [];

  /* options: {title, body: Node|[Node], buttons: [{label, primary, action(close) -> false keeps it open}], onCancel} */
  function open(options) {
    var root = util.$('modalRoot');
    var overlay;
    function close() {
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      stack = stack.filter(function (entry) { return entry.overlay !== overlay; });
      document.removeEventListener('keydown', onKey, true);
    }
    function cancel() {
      close();
      if (options.onCancel) options.onCancel();
    }
    function onKey(event) {
      if (stack[stack.length - 1] !== entry) return;
      if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); cancel(); }
      if (event.key === 'Enter' && event.target.tagName !== 'TEXTAREA' && event.target.tagName !== 'BUTTON') {
        var primary = (options.buttons || []).filter(function (b) { return b.primary; })[0];
        if (primary) { event.preventDefault(); event.stopPropagation(); run(primary); }
      }
    }
    function run(button) {
      var keep = button.action ? button.action(close) === false : false;
      if (!keep) close();
    }
    var buttons = (options.buttons || [{ label: t('btn.ok'), primary: true }]).map(function (button) {
      return h('button', { class: 'btn' + (button.primary ? ' primary' : ''), type: 'button', text: button.label,
                           onclick: function () { run(button); } });
    });
    overlay = h('div', { class: 'overlay' }, [
      h('div', { class: 'dialog', role: 'dialog', 'aria-modal': 'true', 'aria-label': options.title }, [
        h('div', { class: 'dialog-head' }, [
          h('span', { text: options.title }),
          h('button', { class: 'x', type: 'button', title: t('btn.close'), text: '×', onclick: cancel })
        ]),
        h('div', { class: 'dialog-body' }, options.body),
        h('div', { class: 'dialog-foot' }, buttons)
      ])
    ]);
    var entry = { overlay: overlay, close: close };
    stack.push(entry);
    root.appendChild(overlay);
    document.addEventListener('keydown', onKey, true);
    var focus = overlay.querySelector('input, select, textarea') || overlay.querySelector('.btn.primary');
    if (focus) setTimeout(function () { focus.focus(); if (focus.select) focus.select(); }, 0);
    return entry;
  }

  function isOpen() { return stack.length > 0; }

  function field(label, input) {
    return h('div', { class: 'form-row' }, [h('label', { text: label }), input]);
  }

  function message(title, text) {
    open({ title: title, body: [h('p', { text: text })], buttons: [{ label: t('btn.ok'), primary: true }] });
  }

  /* onYes / onNo optional; three buttons when onNo is given (Save / Do not save / Cancel) */
  function confirm(options) {
    var buttons = [{ label: options.yes || t('btn.yes'), primary: true, action: function () { if (options.onYes) options.onYes(); } }];
    if (options.onNo) buttons.push({ label: options.no || t('btn.no'), action: function () { options.onNo(); } });
    buttons.push({ label: t('btn.cancel') });
    open({ title: options.title, body: [h('p', { text: options.text })], buttons: buttons });
  }

  function prompt(options) {
    var input = h('input', { type: 'text', value: options.value || '' });
    open({
      title: options.title,
      body: [field(options.label, input)],
      buttons: [
        { label: t('btn.ok'), primary: true, action: function () {
          var value = input.value.trim();
          if (!value) { input.focus(); return false; }
          options.onOk(value);
          return true;
        } },
        { label: t('btn.cancel') }
      ]
    });
  }

  /* Closes the open dialog without running a button action */
  function closeTop() {
    var top = stack[stack.length - 1];
    if (top) top.close();
  }

  return { open: open, isOpen: isOpen, field: field, message: message, confirm: confirm, prompt: prompt,
           close: closeTop };
})();

/* ======================================================================
 * zLitmus - menu bar, popup and context menus (keyboard: Alt+letter, arrows, Enter, Esc)
 * Items name a command of ZL.Commands (defined in app.js).
 * ==================================================================== */
ZL.Menu = (function () {
  var util = ZL.util;
  var h = util.h;
  var t = ZL.i18n.t;
  var SEP = { separator: true };

  var definition = [
    { id: 'file', label: 'menu.file', items: [
      { cmd: 'file.new', label: 'cmd.file.new', shortcut: 'Ctrl+N' },
      { cmd: 'file.open', label: 'cmd.file.open', shortcut: 'Ctrl+O' },
      SEP,
      { cmd: 'file.save', label: 'cmd.file.save', shortcut: 'Ctrl+S' },
      { cmd: 'file.saveAll', label: 'cmd.file.saveAll', shortcut: 'Ctrl+Shift+S' },
      SEP,
      { cmd: 'file.close', label: 'cmd.file.close' },
      SEP,
      { cmd: 'file.preferences', label: 'cmd.file.preferences' },
      { cmd: 'page.install', label: 'cmd.page.install' },
      SEP,
      { cmd: 'file.exit', label: 'cmd.file.exit' }
    ] },
    { id: 'project', label: 'menu.project', items: [
      { cmd: 'project.refresh', label: 'cmd.project.refresh' },
      { cmd: 'project.rename', label: 'cmd.project.rename' },
      { cmd: 'project.delete', label: 'cmd.project.delete' }
    ] },
    { id: 'request', label: 'menu.request', items: [
      { cmd: 'request.new', label: 'cmd.request.new' },
      { cmd: 'request.clone', label: 'cmd.request.clone' },
      { cmd: 'request.rename', label: 'cmd.request.rename' },
      { cmd: 'request.delete', label: 'cmd.request.delete' },
      SEP,
      { cmd: 'request.recreate', label: 'cmd.request.recreate' },
      { cmd: 'request.format', label: 'cmd.request.format', shortcut: 'Ctrl+Shift+F' },
      SEP,
      { cmd: 'request.send', label: 'cmd.request.send', shortcut: 'Ctrl+Enter' },
      SEP,
      { cmd: 'request.exportRequest', label: 'cmd.request.exportRequest' },
      { cmd: 'request.exportResponse', label: 'cmd.request.exportResponse' }
    ] },
    { id: 'view', label: 'menu.view', items: [
      { cmd: 'view.navigator', label: 'cmd.view.navigator' },
      { cmd: 'view.properties', label: 'cmd.view.properties' },
      { cmd: 'view.log', label: 'cmd.view.log' },
      SEP,
      { cmd: 'view.wrap', label: 'cmd.view.wrap' },
      { cmd: 'view.layout', label: 'cmd.view.layout' },
      { cmd: 'page.refresh', label: 'cmd.page.refresh', shortcut: 'F5' },
      SEP,
      { cmd: 'view.theme', label: 'cmd.view.theme' }
    ] },
    { id: 'help', label: 'menu.help', items: [
      { cmd: 'help.guide', label: 'cmd.help.guide', shortcut: 'F1' },
      { cmd: 'help.shortcuts', label: 'cmd.help.shortcuts' },
      SEP,
      { cmd: 'help.about', label: 'cmd.help.about' }
    ] }
  ];

  var openIndex = -1;
  var popup = null;

  function command(id) { return ZL.Commands[id]; }
  function enabled(item) {
    var c = command(item.cmd);
    return !!c && (!c.enabled || c.enabled());
  }
  function checked(item) {
    var c = command(item.cmd);
    return !!c && !!c.checked && c.checked();
  }

  function mnemonic(label) { return label.charAt(0).toLocaleLowerCase(ZL.i18n.lang()); }

  function render() {
    var bar = util.clear(util.$('menubar'));
    definition.forEach(function (menu, index) {
      var label = t(menu.label);
      bar.appendChild(h('button', {
        class: 'menu-title' + (index === openIndex ? ' open' : ''), type: 'button', role: 'menuitem',
        'data-menu': menu.id,
        /* the bar is drawn again when a menu opens: the event must not reach the "click outside" handler */
        onmousedown: function (event) { event.preventDefault(); event.stopPropagation(); toggle(index); },
        onmouseenter: function () { if (openIndex >= 0 && openIndex !== index) openMenu(index, 0); }
      }, [h('span', { class: 'mnemonic', text: label.charAt(0) }), label.substring(1)]));
    });
  }

  function toggle(index) {
    if (openIndex === index) close(); else openMenu(index, -1);
  }

  function openMenu(index, activeItem) {
    close();
    openIndex = index;
    render();
    var anchor = util.$('menubar').children[index].getBoundingClientRect();
    var items = definition[index].items.map(function (item) {
      if (item.separator) return item;
      return { label: t(item.label), shortcut: item.shortcut, enabled: enabled(item), checked: checked(item),
               run: function () { ZL.App.run(item.cmd); } };
    });
    show(items, anchor.left, anchor.bottom, activeItem, true);
  }

  /* items: [{label, shortcut, enabled, checked, run} | {separator: true}] */
  function show(items, x, y, activeItem, fromBar) {
    if (!fromBar) close();
    var root = util.$('popupRoot');
    var rows = [];
    var box = h('div', { class: 'popup', role: 'menu' });
    items.forEach(function (item) {
      if (item.separator) { box.appendChild(h('div', { class: 'sep' })); return; }
      var row = h('div', {
        class: 'item' + (item.enabled === false ? ' disabled' : '') + (item.checked ? ' checked' : ''),
        role: 'menuitem',
        onmouseenter: function () { setActive(rows.indexOf(row)); },
        onmousedown: function (event) { event.preventDefault(); event.stopPropagation(); choose(rows.indexOf(row)); }
      }, [h('span', { text: item.label }), item.shortcut ? h('span', { class: 'shortcut', text: item.shortcut }) : null]);
      row.item = item;
      rows.push(row);
      box.appendChild(row);
    });
    root.appendChild(box);
    var width = box.offsetWidth || 220;
    var height = box.offsetHeight || 200;
    box.style.left = Math.max(0, Math.min(x, window.innerWidth - width - 4)) + 'px';
    box.style.top = Math.max(0, Math.min(y, window.innerHeight - height - 4)) + 'px';
    popup = { box: box, rows: rows, active: -1 };
    setActive(activeItem === 0 ? firstEnabled(0, 1) : -1);

    function setActive(index) {
      rows.forEach(function (r, i) { r.classList.toggle('active', i === index); });
      popup.active = index;
    }
    function choose(index) {
      var row = rows[index];
      if (!row || row.item.enabled === false) return;
      close();
      row.item.run();
    }
    function firstEnabled(from, step) {
      for (var i = 0, j = from; i < rows.length; i++, j = (j + step + rows.length) % rows.length) {
        if (rows[j].item.enabled !== false) return j;
      }
      return -1;
    }
    popup.move = function (step) {
      var start = popup.active < 0 ? (step > 0 ? 0 : rows.length - 1) : (popup.active + step + rows.length) % rows.length;
      setActive(firstEnabled(start, step));
    };
    popup.choose = function () { choose(popup.active); };
  }

  function close() {
    util.clear(util.$('popupRoot'));
    popup = null;
    if (openIndex >= 0) { openIndex = -1; render(); }
  }

  function isOpen() { return !!popup; }

  /* Keyboard: returns true when the event was used */
  function onKey(event) {
    if (event.altKey && !event.ctrlKey && event.key && event.key.length === 1) {
      var key = event.key.toLocaleLowerCase(ZL.i18n.lang());
      for (var i = 0; i < definition.length; i++) {
        if (mnemonic(t(definition[i].label)) === key) { openMenu(i, 0); return true; }
      }
    }
    if (!popup) return false;
    switch (event.key) {
      case 'Escape': close(); return true;
      case 'ArrowDown': popup.move(1); return true;
      case 'ArrowUp': popup.move(-1); return true;
      case 'ArrowRight': if (openIndex >= 0) { openMenu((openIndex + 1) % definition.length, 0); return true; } return false;
      case 'ArrowLeft':
        if (openIndex >= 0) { openMenu((openIndex - 1 + definition.length) % definition.length, 0); return true; }
        return false;
      case 'Enter': popup.choose(); return true;
      default: return false;
    }
  }

  document.addEventListener('mousedown', function (event) {
    var target = event.target;
    if (!popup || !document.body.contains(target)) return;
    if (!popup.box.contains(target) && !util.$('menubar').contains(target)) close();
  });

  /* All command ids used by the menus (the tests compare them with ZL.Commands) */
  function commandIds() {
    var ids = [];
    definition.forEach(function (menu) { menu.items.forEach(function (item) { if (item.cmd) ids.push(item.cmd); }); });
    return ids;
  }

  return { definition: definition, render: render, show: show, close: close, isOpen: isOpen, onKey: onKey,
           commandIds: commandIds, openMenu: openMenu };
})();
